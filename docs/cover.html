<!doctype html>
<html lang="en" data-theme="ega">
<head><meta charset="utf-8"><title>DOS Window — cover</title>
<link rel="stylesheet" href="../dos-window/assets/dos-window.css">
<style>
  body { margin: 0; }
  .cv { position: relative; width: 960px; height: 288px; background: var(--desk); overflow: hidden; font-family: var(--font-vga); -webkit-font-smoothing: none; }
  .cv svg { position: absolute; inset: 0; }
  .dot { fill: var(--desk-dot); }
  [data-theme="dark"] .dot { fill: var(--bar-line); }
  .grey { fill: var(--ega-7); }
  .teal { fill: var(--ega-3); }
  .mag { fill: var(--ega-5); }
  .grn { fill: var(--ega-2); }
  .shd { fill: var(--ega-0); fill-opacity: .82; }
  .edge { fill: none; stroke: var(--ega-15); stroke-width: 2px; }
  .sq { rx: var(--radius-none); }
  .name { position: absolute; left: 40px; bottom: 58px; margin: 0; font-size: 64px; line-height: .95; font-weight: 400; color: var(--ink); max-width: 440px; }
  .tag { position: absolute; left: 40px; bottom: 28px; margin: 0; font-size: 14px; color: var(--meta); max-width: 440px; }
</style></head>
<body>
<div class="cv">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: ega-7 grey window 270×170, ega-3 teal window 190×196 (bleeds off the bottom), ega-5 caption strip 270×22, ega-2 button 96×22; shadows ega-0 @ .82 offset 14×12 (shadow-win) and 8×6 (shadow-btn)
      arrangement: two overlapping windows stacked down-right, the teal one bleeding off the bottom edge, like a crowded DOS desktop
      pattern: dot grid at 8px pitch (2× the desk's 4px dots) right of x=480 — the system is precise, mono and grid-bound, and its desk IS a dot grid
      scales: radius-none on every block; stroke-line 2px white edge (win-border), offsets from shadow-win / shadow-btn
    -->
    <defs>
      <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
        <rect class="dot" x="3" y="3" width="2" height="2"/>
      </pattern>
    </defs>
    <rect x="480" y="0" width="480" height="288" fill="url(#dots)"/>

    <rect class="shd sq" x="550" y="50" width="270" height="170"/>
    <rect class="grey sq" x="536" y="38" width="270" height="170"/>
    <rect class="mag sq" x="536" y="38" width="270" height="22"/>
    <rect class="edge sq" x="530" y="32" width="282" height="182"/>
    <rect class="shd sq" x="574" y="174" width="96" height="22"/>
    <rect class="grn sq" x="566" y="168" width="96" height="22"/>

    <rect class="shd sq" x="768" y="124" width="190" height="196"/>
    <rect class="teal sq" x="754" y="112" width="190" height="196"/>
    <rect class="edge sq" x="748" y="106" width="202" height="208"/>
  </svg>
  <h1 class="name">DOS Window</h1>
  <p class="tag">EGA, VGA bitmap type and hard shadows for the web.</p>
</div>
</body>
</html>
